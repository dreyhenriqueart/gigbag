name: Deploy Firebase Hosting

on:
  push:
    branches:
      - developer
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: firebase-hosting-gigbag
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.41.9"

      - name: Flutter build web
        working-directory: gigbag_app
        run: |
          flutter pub get
          flutter build web --release --base-href="/"

      - name: Verificar secret FIREBASE_SERVICE_ACCOUNT_GIGBAG_APP
        env:
          FIREBASE_SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_GIGBAG_APP }}
        run: |
          if [ -z "${FIREBASE_SA}" ]; then
            echo "::error::Secret ausente. Em GitHub: Settings → Secrets and variables → Actions → New repository secret."
            echo "::error::Nome: FIREBASE_SERVICE_ACCOUNT_GIGBAG_APP | Valor: JSON inteiro (Firebase Console → Project settings → Service accounts → Generate new private key)."
            exit 1
          fi

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_GIGBAG_APP }}

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Deploy Hosting (gigbag-app.web.app)
        run: firebase deploy --only hosting --project gigbag-app --non-interactive
