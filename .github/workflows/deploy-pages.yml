name: Deploy Gigbag Web (GitHub Pages)

on:
  push:
    branches:
      - developer
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gigbag-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gigbag_app
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.29.3"

      - name: Flutter pub get
        run: flutter pub get

      - name: Build web
        run: flutter build web --release --base-href="/gigbag/"

      - name: Publish site to docs/ on branch developer
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: developer
          publish_dir: gigbag_app/build/web
          destination_dir: docs
          keep_files: true
          commit_message: "deploy: GitHub Pages → docs/ [skip ci]"
