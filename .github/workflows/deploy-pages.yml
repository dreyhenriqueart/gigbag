name: Deploy Gigbag Web (GitHub Pages)

on:
  push:
    branches:
      - developer
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gigbag-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gigbag_app
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.29.3"

      - name: Flutter pub get
        run: flutter pub get

      - name: Build web (base path /gigbag/)
        run: flutter build web --release --base-href="/gigbag/"

      - name: Desativa Jekyll (evita ignorar arquivos do Flutter)
        run: touch build/web/.nojekyll

      - name: Publica só o site na branch gh-pages (raiz)
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: gigbag_app/build/web
          force_orphan: true
          commit_message: "deploy: Pages gigbag [skip ci]"
